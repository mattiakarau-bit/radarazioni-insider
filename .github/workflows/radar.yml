name: RadarAzioni - SEC e pubblicazione
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 */4 * * 1-6'
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: radarazioni-pages
  cancel-in-progress: false
jobs:
  quality:
    uses: ./.github/workflows/quality.yml
  scan_and_package:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Recupera il repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Prepara Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verifica regressioni
        run: python -m unittest discover -s tests -v
      - name: Verifica JavaScript e versione
        run: |
          node --check docs/app.js
          node --check docs/sw.js
          node --test tests/*.test.cjs
      - name: Analizza i nuovi Form 4 SEC
        if: github.event_name != 'push'
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MAX_FORMS_PER_RUN: '180'
          LOOKBACK_DAYS: '7'
        run: python -m scanner.run
      - name: Salva le ultime operazioni nel repository
        if: github.event_name != 'push'
        run: |
          git config user.name 'RadarAzioni Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add docs/data/results.json docs/data/state.json docs/data/events_history.json docs/data/radar.json
          if ! git diff --cached --quiet; then
            git commit -m 'Aggiorna gli eventi SEC'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Configura GitHub Pages
        uses: actions/configure-pages@v5
      - name: Prepara il sito pubblico
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs
  deploy:
    needs: scan_and_package
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - name: Pubblica RadarAzioni su GitHub Pages
        id: pages
        uses: actions/deploy-pages@v4
