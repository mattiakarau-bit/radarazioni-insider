name: RadarAzioni - SEC e pubblicazione
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 */4 * * 1-6'
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: radarazioni-pages
  cancel-in-progress: false
jobs:
  quality:
    uses: ./.github/workflows/quality.yml
  scan_and_package:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Recupera il repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          ref: main
      - name: Prepara Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verifica regressioni
        run: python -m unittest discover -s tests -v
      - name: Verifica JavaScript e versione
        run: |
          node --check docs/app.js
          node --check docs/sw.js
          node --test tests/*.test.cjs
      - name: Analizza i nuovi Form 4 SEC
        if: github.event_name != 'push'
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
          MAX_FORMS_PER_RUN: '180'
          LOOKBACK_DAYS: '7'
          MAX_FACTS_PER_RUN: '5'
        run: python -m scanner.run
      - name: Calcola il Radar semestrale da archivi locali e nuovi depositi
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          # Code publication reuses local SEC data. Scheduled/manual runs keep
          # collecting recent forms and refreshing expired financial snapshots.
          if [ "$EVENT_NAME" = push ]; then
            python -m scanner.universe --force
          else
            python -m scanner.universe --refresh-financials 25
          fi
          python tests/verify_semester.py
      - name: Salva le ultime operazioni nel repository
        run: |
          git config user.name 'RadarAzioni Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add docs/data/results.json docs/data/state.json docs/data/events_history.json docs/data/radar.json docs/data/scan_status.json docs/data/semester_report.json docs/data/search_index.json docs/data/pending_index.json docs/data/companies data/analysis data/insider/amendments.v1.json
          if ! git diff --cached --quiet; then
            git commit -m 'Aggiorna gli eventi SEC'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Configura GitHub Pages
        uses: actions/configure-pages@v5
      - name: Prepara il sito pubblico
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs
  deploy:
    needs: scan_and_package
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - name: Pubblica RadarAzioni su GitHub Pages
        id: pages
        uses: actions/deploy-pages@v4
