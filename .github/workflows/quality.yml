name: Qualità RadarAzioni
on:
  pull_request:
    branches: [main]
  workflow_call:
permissions:
  contents: read
jobs:
  automated_and_mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test Python e JavaScript
        run: |
          python -m unittest discover -s tests -v
          node --test tests/*.test.cjs
          node --check docs/app.js
          node --check docs/radar-core.js
          node --check docs/sw.js
      - name: Verifica end-to-end del semestre sugli archivi SEC autentici
        run: |
          python -m scanner.universe --force
          python tests/verify_semester.py
      - name: Prepara motori browser gratuiti per i test
        run: |
          npm install --ignore-scripts --no-package-lock
          npx playwright install --with-deps chromium webkit
      - name: Test interfaccia iPhone e iPad (WebKit e Chromium)
        run: npm run test:ui
